<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>填报详情 · 碳排放管理</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<!--
  填报详情页（从首页月卡「查看详情」进入）
  与 month-report.html 共用全屏子页外壳，但整页只读：没有输入框，不能在详情里改数。
  出口只有一个 —— 顶栏左上角「←」。要改数据回首页月卡点「重新填报」。
  入参走 URL：report-detail.html?year=2026&month=7
-->
<body class="report-page detail-page">
  <header class="report-topbar">
    <a class="report-back" id="rd-back" href="manual-entry.html" title="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <h1 class="report-title" id="rd-title">填报详情</h1>
  </header>

  <nav class="report-entities" id="rd-entities"></nav>
  <nav class="report-tabs" id="rd-tabs"></nav>

  <div class="report-body" id="rd-body">
    <table class="report-table rd-table" id="rd-table"></table>
  </div>

  <script src="js/app.js"></script>
  <script src="js/report-config-store.js"></script>
  <script src="js/report-data-store.js"></script>
  <script src="js/report-detail.js"></script>
</body>
</html>
