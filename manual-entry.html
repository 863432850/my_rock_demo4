<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手工数据填报 · 碳排放管理</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="app-header"></header>
    <div class="app-body">
      <aside class="app-sidebar">
        <nav class="sidebar-menu" id="sidebar-menu"></nav>
      </aside>
      <main class="app-main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content-area manual-entry-page">

          <h2 class="me-title">炼钢-粗钢</h2>

          <div class="filter-bar">
            <div class="filter-left">
              <div class="filter-item">
                <label for="me-year">年度</label>
                <select id="me-year" class="year-select"></select>
              </div>
              <div class="filter-actions">
                <button type="button" class="btn btn-primary" id="me-search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  查询
                </button>
                <button type="button" class="btn" id="me-reset">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
                  重置
                </button>
              </div>
            </div>
          </div>

          <div class="me-grid" id="me-grid"></div>

        </div>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/report-config-store.js"></script>
  <script src="js/report-data-store.js"></script>
  <script src="js/manual-entry.js"></script>
</body>
</html>
