<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据填报 · 碳排放管理</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<!--
  数据填报页（从首页月卡「立即上报」/「重新填报」进入）
  这是一个全屏页面：不带平台顶栏与左侧菜单，自成一套。
  布局：顶栏（返回 + 标题 + 导出模版/导入/填报项配置）/ 主体页签（全厂 | 焦化工序）/ 参数页签 / 表格 / 底部保存提交
  入参走 URL：month-report.html?year=2026&month=9[&mode=re]
-->
<body class="report-page">
  <header class="report-topbar">
    <a class="report-back" id="rp-back" href="manual-entry.html" title="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <h1 class="report-title" id="rp-title">数据填报</h1>
    <div class="report-topbar-right">
      <button type="button" class="btn" id="rp-export">导出模版</button>
      <button type="button" class="btn" id="rp-import">导入</button>
      <button type="button" class="btn btn-primary" id="rp-config">填报项配置</button>
      <input type="file" id="rp-file" accept=".xlsx,.xls,.csv" hidden />
    </div>
  </header>

  <!-- 报告主体页签：全厂 / 焦化工序，各自下面都是同一套参数页签 -->
  <nav class="report-entities" id="rp-entities"></nav>

  <nav class="report-tabs" id="rp-tabs"></nav>

  <div class="report-body" id="rp-body">
    <table class="report-table" id="rp-table"></table>
  </div>

  <footer class="report-footbar">
    <button type="button" class="btn btn-primary" id="rp-save">保存</button>
    <button type="button" class="btn btn-primary" id="rp-submit">提交</button>
  </footer>

  <script src="js/app.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/report-config-store.js"></script>
  <script src="js/report-data-store.js"></script>
  <script src="js/month-report.js"></script>
</body>
</html>
